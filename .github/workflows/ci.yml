name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn test

  admin-web:
    name: Admin web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  miniapp:
    name: Miniapp syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find miniapp -type f -name "*.js" | sort)

  deployment:
    name: Deployment config and repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        env:
          TAKEOUT_JWT_SECRET: ci-validation-only-secret
          MYSQL_PASSWORD: ci-validation-db-password
          MYSQL_ROOT_PASSWORD: ci-validation-root-password
          REDIS_PASSWORD: ci-validation-redis-password
        run: docker compose -f deploy/docker/docker-compose.mysql.yml -f deploy/docker/docker-compose.redis.yml config --quiet

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $files = @('scripts/mysql-backup.ps1', 'scripts/mysql-restore.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }

      - name: Reject tracked runtime artifacts
        shell: bash
        run: |
          set -euo pipefail
          tracked=$(git ls-files | grep -E '(^|/)(target|dist|node_modules|data|backups)/|\.log$|\.mv\.db$' | grep -v '^server/uploads/.gitkeep$' || true)
          if [[ -n "$tracked" ]]; then
            echo "$tracked"
            exit 1
          fi
